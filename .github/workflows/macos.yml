name: macOS offline verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build App and CLI
        run: BUILD_DIR="$RUNNER_TEMP/msu2-build" bash msu2_macos_app/scripts/build.sh
      - name: Run offline tests
        run: BUILD_DIR="$RUNNER_TEMP/msu2-tests" bash msu2_macos_app/scripts/test.sh
      - name: Run ASan and UBSan tests
        run: SANITIZERS=1 BUILD_DIR="$RUNNER_TEMP/msu2-sanitized" bash msu2_macos_app/scripts/test.sh
      - name: Link hardware driver without running it
        run: BUILD_DIR="$RUNNER_TEMP/msu2-build" bash msu2_macos_app/scripts/build_hardware_driver.sh
